# Fuzz testing targets for clean theorem prover
# Author: Andrew Yates <andrewyates.name@gmail.com>

[package]
name = "clean-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Compiles under `targo --unverified check` (measured). Running the targets is a
# STOCK EXCEPTION (Trust lacks the ASan runtime cargo-fuzz links; measured
# `trustc -Zsanitizer=address` -> `ld: library 'rustc-trust_rt.asan' not found`).
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# clean crates
[dependencies.clean-parser]
path = "../crates/clean-parser"

[dependencies.clean-olean]
path = "../crates/clean-olean"

[dependencies.clean-auto]
path = "../crates/clean-auto"
features = ["fuzz"]

# Lean 4 syntax parser fuzz target
[[bin]]
name = "clean_parser"
path = "fuzz_targets/clean_parser.rs"
test = false
doc = false
bench = false

# .olean binary format deserializer fuzz target
[[bin]]
name = "clean_olean"
path = "fuzz_targets/clean_olean.rs"
test = false
doc = false
bench = false

# lean4export NDJSON front door fuzz target (`clean olean replay --from-export`)
[[bin]]
name = "clean_ndjson"
path = "fuzz_targets/clean_ndjson.rs"
test = false
doc = false
bench = false

# CDCL SAT solver fuzz target (soundness + crash testing)
[[bin]]
name = "clean_cdcl"
path = "fuzz_targets/clean_cdcl.rs"
test = false
doc = false
bench = false
