# A live full-workspace Trust check exceeded the default eight-hour process
# bound on seal 16387. Keep a finite workspace-owned backstop: 2500 scales
# the reference clocks by 2.5 and gives the compiler process twenty hours.
# Solver effort, verification policy and proof requirements retain their defaults.
[trust]
backstop = 2500

[workspace]
resolver = "2"
# third-party/carcara is vendored third-party source with its own workspace
# (see third-party/carcara/DOWNSTREAM.md); clean-auto reaches it as a path
# dependency, so it must be excluded here or Cargo would claim it as a member.
exclude = ["fuzz", "scripts/isa_harness", "third-party/carcara"]
members = [
    "crates/clean",
    "crates/clean-auto",
    "crates/clean-autoform",
    "crates/clean-c-sem",
    "crates/clean-cake",
    "crates/clean-ck0",
    "crates/clean-cli",
    "crates/clean-compiler",
    "crates/clean-discovery",
    "crates/clean-elab",
    "crates/clean-features",
    "crates/clean-fold",
    "crates/clean-kernel",
    "crates/clean-lake",
    "crates/clean-lsp",
    "crates/clean-macro",
    "crates/clean-math-project",
    "crates/clean-olean",
    "crates/clean-mathverse",
    "crates/clean-native",
    "crates/clean-parser",
    "crates/clean-reflect",
    "crates/clean-runtime",
    "crates/clean-rust-sem",
    "crates/clean-server",
    "crates/clean-sys",
    "crates/clean-tla",
    "crates/clean-verify",
]
# Keep default `cargo check/build/test` focused on the publish smoke surface.
# Core subsystem crates such as clean-kernel, clean-elab, clean-olean,
# clean-rust-sem, and clean-verify are still compiled through downstream
# crates here; run their internal suites explicitly with
# `cargo test --locked -p <crate>` when working on those subsystems.
default-members = [
    "crates/clean",
    "crates/clean-auto",
    "crates/clean-compiler",
    "crates/clean-macro",
    "crates/clean-parser",
    "crates/clean-runtime",
    "crates/clean-sys",
    # clean-tla consumes tla-core through an exact-revision Git authority — the
    # sibling-Ty `[patch]` redirect was removed on 2026-08-12 (93550c617) — so it
    # remains part of the publish smoke surface. The tlaps-bench runner was
    # absorbed as its `bench` module in rearch stage 9.
    "crates/clean-tla",
]

[workspace.package]
version = "0.9.3"
edition = "2021"
# Minimum Supported Rust Version. The codebase uses if-let chains (1.87),
# the `[lints]` workspace inheritance (1.74), and various clippy lints
# promoted in 1.85+. We pin to a recent-stable floor to keep the bar
# clear without artificially blocking older toolchains.
rust-version = "1.90"
authors = ["Andrew Yates <andrewyates.name@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/alabsystems/clean"

readme = "README.md"
[workspace.lints.rust]
# Keep hygiene diagnostics visible across every workspace crate. Feature- or
# target-specific exceptions belong at the narrowest affected item with a
# concrete justification; workspace-wide `allow` levels conceal real drift.
# Cargo does not allow member manifests to inherit workspace lints and keep
# package-local lint tables, so the custom cfg whitelist lives here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(trust_verify)', 'cfg(clean_trust_islands)', 'cfg(feature, values("carcara-verify", "debug-infer", "debug-whnf", "farkas-constructive", "geometry-tools", "math-overlays", "mimalloc", "round-trip-compile", "test-utils", "ay-smt"))'] }
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"
unused_must_use = "warn"
unreachable_code = "warn"
unreachable_patterns = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
private_interfaces = "warn"
noop_method_call = "warn"
non_ascii_idents = "forbid"
keyword_idents_2024 = "forbid"

[workspace.lints.clippy]
# Hard gate: the workspace is clippy-clean as of Waves 41–56; deny so
# regressions break the build immediately. Per-lint allows below cover
# the small set of categories where the convention is intentional.
#
# Every `= "allow"` entry below (and every entry in [workspace.lints.rust]
# above) is justified in docs/JUSTIFIED_EXCEPTIONS.md. If you add a new
# allow here, add a matching row there in the same commit.
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -2 }
nursery = { level = "allow", priority = -3 }
unwrap_used = "allow"
panic = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
doc_markdown = "allow"
# Doc-list rendering style: the codebase uses multi-paragraph list items and
# recursor/eliminator explanations whose continuation lines clippy can't
# disambiguate (suggestions are MaybeIncorrect, so `--fix` skips them). These
# are rendering-style lints, not correctness; allow like `doc_markdown`.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
# Proof systems carry diagnostic context (file/span/kind) on error variants,
# making `Result<T, E>` legitimately large; boxing every error site obscures
# the type without a performance benefit at our error rates.
result_large_err = "allow"
# AST / Expr enums have inherently variable-sized variants (BVar(u32) vs
# Lam(BinderInfo, Expr, Expr)); boxing every large variant pessimises the
# common-case access pattern.
large_enum_variant = "allow"
# Proof / kernel APIs legitimately carry many type parameters (`Result<X,
# fn(Y, Z) -> W>`); flattening into newtypes hurts readability.
type_complexity = "allow"

[workspace.dependencies]
# Core
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"

# Data structures
ahash = "0.8"
hashbrown = { version = "0.17.1", features = ["serde"] }
# NO `features = ["serde"]`. That feature is a `smallvec -> serde` NORMAL
# dependency edge, and `smallvec` was one of the third-party packages holding
# `serde` in Trust's shipping closure. The single serde-derived `SmallVec` in
# this workspace is `ExprKind::Const`'s `LevelVec`, which now encodes through
# `clean_kernel::expr::level_vec_serde` — a verbatim transcription of
# smallvec's impl, gated on byte-identity against it. `smallvec` itself stays
# in the graph (parking_lot_core and tracing-subscriber need it); what is
# removed is the serde edge, not the package.
smallvec = { version = "1.15.1" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
# bincode 3.0.0 is a deliberate `compile_error!` placeholder (xkcd/2347); 2.x is the real latest.
bincode = { version = "2", features = ["serde"] }
base64 = "0.22"
syn = "2.0"
proc-macro2 = "1.0"

# Compression
lz4_flex = "0.13"
zstd = { version = "0.13", features = ["zdict_builder"] }
flate2 = "1"

# HTTP
ureq = "3"
# Minimal HTTP/1.1 request parsing for the Mathverse Cloud Run distribution
# front-end (`mathverse_serve`). We deliberately avoid a high-level framework
# (axum/hyper are not vendored offline here); the service speaks raw HTTP/1.1
# over `tokio::net`, the same posture as `clean-server`'s WebSocket listener.
httparse = "1.10"
percent-encoding = "2.3"

# Async
# Keep the complete runtime surface without procedural macros for library consumers.
# Packages using Tokio macros, and test graphs that need them, opt into `full`.
tokio = { version = "1.0", features = [
    "fs", "io-util", "io-std", "net", "parking_lot", "process",
    "rt", "rt-multi-thread", "signal", "sync", "time",
] }
tokio-tungstenite = "0.29"
futures-util = "0.3"

# Testing
proptest = "1.4"
criterion = "0.8.2"
tempfile = "3.14"
walkdir = "2.5"
serial_test = "3.2"
ntest = "0.9"
# Directory scanning for clean-tla's absorbed TLAPS bench runner.
glob = "0.3"

# Parallelism
rayon = "1.10"

# Big integers / rationals
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

# Allocators (optional, for performance testing + full-corpus memory bounding).
# Installing `mimalloc` as the global allocator links the mimalloc static lib,
# which exports `mi_collect` (the per-module arena purge PARAGON calls to turn
# freed high-water-mark pages back into returned RSS). We declare that one
# `extern "C"` symbol ourselves rather than enabling the crate's `extended`
# feature, which would pull in the (un-vendored) `cty` dependency.
mimalloc = { version = "0.1", default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI argument parsing (Epic #3436: per-crate cli modules)
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"

# Internal crates (alphabetically ordered)
clean = { path = "crates/clean" }
clean-auto = { path = "crates/clean-auto" }
clean-c-sem = { path = "crates/clean-c-sem" }
clean-ck0 = { path = "crates/clean-ck0" }
clean-cli = { path = "crates/clean-cli" }
clean-compiler = { path = "crates/clean-compiler" }
clean-discovery = { path = "crates/clean-discovery" }
clean-elab = { path = "crates/clean-elab", features = ["ay-smt"] }
clean-features = { path = "crates/clean-features" }
clean-fold = { path = "crates/clean-fold" }
clean-kernel = { path = "crates/clean-kernel" }
clean-mathverse = { path = "crates/clean-mathverse" }
clean-lake = { path = "crates/clean-lake" }
clean-native = { path = "crates/clean-native" }
clean-cake = { path = "crates/clean-cake" }
# Cross-repo verification vocabulary lives in TrustIr's dependency-leaf
# contract. Its immutable Git identity keeps standalone Clean builds independent
# of whichever sibling checkout happens to be present. This is the coherent
# cycle-cut revision already selected by the Ty and TrustCG predecessors below;
# advancing only this edge splits TrustIR's nominal Rust types when Clean's
# all-features tests pass TrustCG values back into Clean. TrustIR's successor
# advances to this Clean revision after it is published.
trust-ir-contract = { git = "https://github.com/alabsystems/trust-ir.git", rev = "8bae728257b123d6394b2dc049b3573ad885049f" }
clean-lsp = { path = "crates/clean-lsp" }
clean-macro = { path = "crates/clean-macro" }
clean-math-project = { path = "crates/clean-math-project" }
clean-olean = { path = "crates/clean-olean" }
clean-parser = { path = "crates/clean-parser" }
clean-runtime = { path = "crates/clean-runtime" }
clean-rust-sem = { path = "crates/clean-rust-sem" }
clean-server = { path = "crates/clean-server" }
clean-tla = { path = "crates/clean-tla" }
clean-verify = { path = "crates/clean-verify" }

# Arkworks cryptography (for polynomial commitments and folding)
ark-ff = "0.5"
ark-ec = "0.5"
ark-poly = "0.5"
ark-bls12-381 = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"

# Hashing
sha2 = "0.11"
blake3 = "1.5"
# Asymmetric signing for the Mathverse Phase-2 trust layer (provenance
# attestation of kernel-re-verified verdicts). `ring 0.17` is already resolved
# in Cargo.lock transitively (via rustls), so promoting it to a direct
# workspace dependency does not change the resolved graph — it stays
# `--offline --locked`-clean. Exposes real Ed25519 sign/verify; no fake crypto.
ring = "0.17"
# constant_time_eq 0.5 requires rustc >=1.95; the Trust toolchain (1.99.0-dev) and
# the public 1.97.1 pin both satisfy it, so the previous `=0.4.2` MSRV pin (for
# 1.94.1) is lifted. blake3 may still resolve its own
# 0.4.x transitively (it declares `^0.4.2`); clean-olean uses 0.5. See issue #3535.
constant_time_eq = "0.5"

# Memory mapping
memmap2 = "0.9"

# Stack management
stacker = "0.1"

# TLA+ shared AST. Keep the dependency on an immutable internal Ty authority.
# It pins a Ty source revision that is already published: Clean(new) ->
# Ty(old), then Ty(new) may advance to Clean(new), keeping the authority
# history acyclic. Final-mode publication maps this exact revision through the
# release ledger (publish/transform.py `map_ty`), so it moves only to a Ty
# revision the ledger maps to a public release. Local cross-repository
# development can provide an uncommitted Cargo override, but this publishable
# manifest must resolve exactly the same graph under `--locked` in every clone.
tla-core = { git = "https://github.com/alabsystems/ty.git", rev = "aa96570ae592394a8c50102aa5782683543bd2c9" }

# The SMT solver sibling repo was renamed z4 -> ay (alabsystems/ay). Keep
# every AY crate on one immutable Git revision so Clean remains consumable as a
# plain Cargo Git dependency: a `../ay` path escapes Cargo's Git checkout and
# makes downstream resolution fail before features can be selected. Monorepo
# integrations may redirect this exact URL with a root-level `[patch]` table.
#
# Merge note (integrate/crash-2026-06-02): the proof-carrying-farkas branch
# kept the legacy `z4` dependency KEYS aliased to the `ay` packages, but every
# consuming crate on personal/main (clean-elab, clean-auto, ...) now
# references `ay.workspace = true` / the `ay-smt` feature. No source in the
# merged tree references the `z4*` keys, so personal/main's full `ay` rename is
# the correct, semantically-complete side; the `z4` aliases are dropped.
# Trust: default-features = false drops ay's GMP-backed LRA path (`rug` +
# `gmp-mpfr-sys`). clean-auto links ay in-process via the `ay-smt` feature; the
# pure-Rust num_rational overflow fallback is functionally identical and adds no
# native `-lgmp` link, so the Trust rustc_driver link (which pulls clean-auto
# through trust-certify) has no undefined `___gmpq_*` symbols.
ay = { package = "ay", version = "0.28.2", git = "https://github.com/alabsystems/ay.git", rev = "8bbc43108643d475a81a89b2b4f262e817ee1724", default-features = false }
ay-dpll = { package = "ay-dpll", version = "0.28.2", git = "https://github.com/alabsystems/ay.git", rev = "8bbc43108643d475a81a89b2b4f262e817ee1724" }
ay-core = { package = "ay-core", version = "0.28.2", git = "https://github.com/alabsystems/ay.git", rev = "8bbc43108643d475a81a89b2b4f262e817ee1724" }
ay-lean-bridge = { package = "ay-lean-bridge", version = "0.28.2", git = "https://github.com/alabsystems/ay.git", rev = "8bbc43108643d475a81a89b2b4f262e817ee1724" }
ay-proof = { package = "ay-proof", version = "0.28.2", git = "https://github.com/alabsystems/ay.git", rev = "8bbc43108643d475a81a89b2b4f262e817ee1724" }
ay-frontend = { package = "ay-frontend", version = "0.28.2", git = "https://github.com/alabsystems/ay.git", rev = "8bbc43108643d475a81a89b2b4f262e817ee1724" }
ay-translate = { package = "ay-translate", version = "0.28.2", git = "https://github.com/alabsystems/ay.git", rev = "8bbc43108643d475a81a89b2b4f262e817ee1724" }

[profile.dev]
# Reduce debug binary sizes to mitigate macOS _dyld_start stalls (#1388).
# Default debug=2 produces 30-47MB test binaries; debug=1 cuts ~40%.
# split-debuginfo=unpacked avoids embedding DWARF in the binary.
debug = 1
split-debuginfo = "unpacked"

# Reference-kernel replays need optimization without changing debug-only
# validation, overflow checks, or the test selection. Keep release replays
# separate so production-only paths are exercised too.
[profile.authority]
inherits = "test"
opt-level = 2
codegen-units = 16
debug-assertions = true
overflow-checks = true

# lto disabled in release + bench profiles. `lto = true` was costing
# ~10 min per rebuild during the test-fix iteration on a development
# machine and pushed workspace `cargo test --release` runs over normal
# automation time budgets. Flip back to `true` for production release builds.
[profile.release]
lto = false
# Parallel codegen for fast builds. clean already disabled LTO here to keep
# rebuilds within automation budgets; codegen-units=1 (single-threaded codegen)
# was the remaining cost — e.g. clean-kernel took ~18 min on one core during the
# Trust bootstrap. cu=16 parallelizes it with negligible runtime impact (no LTO to
# lose). Production/max-perf builds set lto=true + cu=1 explicitly.
codegen-units = 16
panic = "abort"
overflow-checks = true

[profile.bench]
lto = false
codegen-units = 1

# TrustIR's publishable manifest pins Clean crates by Git revision. Redirect
# those dependencies back into this workspace so standalone Clean testing does
# not resolve a second copy of its own packages through the external graph.
[patch."https://github.com/alabsystems/clean.git"]
clean-kernel = { path = "crates/clean-kernel" }
clean-mathverse = { path = "crates/clean-mathverse" }
clean-olean = { path = "crates/clean-olean" }

[workspace.metadata.atpkg]
# The user-facing commands for `clean`. The mathverse_*, mm_*, verify_*, *_gate, solver_serve,
# doc-gen and conformance bins are internal tooling.
expose = ["clean", "clean-lsp"]
# aterm ships the complete proof toolchain: Clean must independently check AY's
# Alethe proofs. A default-feature build exposes the command but rejects every
# proof. This feature also enables the required ay-smt lane transitively.
# clean-lsp is not a default-member, so build both exposed programs explicitly.
# WS6.13 (two-language roadmap, F-119 scout-lean B7): the shipped `clean` MUST
# carry the trust-ir backend, so `clean compile --emit trustir|trustir-bin|obj`
# exist in the pack. Without the feature the variants are not compiled at all
# and `--emit` offers only `l5ir|l5cnf|c|rust` (measured on the stage1 build).
# The pack's linkable runtime archive (`clean_runtime.o` + `runtime_extern.o` +
# the prelude-shims object) needs no build arg: it ships INSIDE the binary and
# is written out by `clean native-runtime --out-dir <dir>`; `clean --version`
# prints the git sha (F-118). scripts/test_atpkg_recipe.py guards this line;
# publish/transform.py's bootstrap projection strips the feature together with
# the backend it forwards to (docs/PACKAGING_TRUST_IR_BACKEND.md).
build-args = ["-p", "clean", "-p", "clean-lsp", "--features", "clean/carcara-verify,clean/trust-ir-backend"]

# What a package of main is held to before aterm's tip lane (`atpkg-publish lane run tip`)
# stages it. The two source steps are this package's own guards in publish/config.sh's release
# gate; the build is the pack itself (`build-args` above); the packed steps are the controls
# build 13482 (0.9.0) was cut under on 2026-11-07, run against the packed `clean` and
# `clean-lsp` from a scratch directory outside the checkout with an empty HOME. Each step
# passes only if it exits 0 within `within-secs` with at least `min-tests` libtest passes.
# The recipe above keeps the features the package needs.
[[workspace.metadata.atpkg.qualify]]
name = "atpkg-recipe"
stage = "source"
run = ["python3.14", "scripts/test_atpkg_recipe.py"]
within-secs = 120

# A build with the package's proof-checking feature checks an AY proof and refuses a false one.
[[workspace.metadata.atpkg.qualify]]
name = "atpkg-proof-checker"
stage = "source"
run = [
    "targo", "--unverified", "test", "--locked", "-p", "clean",
    "--features", "clean/carcara-verify", "--test", "atpkg_proof_checker",
]
within-secs = 6480
min-tests = 2

[[workspace.metadata.atpkg.qualify]]
name = "build"
stage = "build"
within-secs = 6240

[[workspace.metadata.atpkg.qualify]]
name = "version"
stage = "packed"
run = ["{bin}/clean", "--version"]
within-secs = 120

# Both commands are native to this machine, signed, link only system libraries, and
# `clean-lsp` reaches its sibling.
[[workspace.metadata.atpkg.qualify]]
name = "binaries"
stage = "packed"
run = ["/bin/sh", "-c", '''
set -u
arch=$(uname -m)
for exe in clean clean-lsp; do
  /usr/bin/file "{bin}/$exe" | grep -qF "$arch" || exit 1
  /usr/bin/codesign --verify --strict "{bin}/$exe" || exit 1
  libs=$(/usr/bin/otool -L "{bin}/$exe" | tail -n +2 | awk '{print $1}') || exit 1
  [ -n "$libs" ] || exit 1
  for lib in $libs; do case "$lib" in /usr/lib/*|/System/Library/*) ;; *) echo "$exe links $lib" >&2; exit 1 ;; esac; done
done
"{bin}/clean-lsp" --help </dev/null | grep -qF lsp
''']
within-secs = 120

# A true theorem checks and a false one is refused by name.
[[workspace.metadata.atpkg.qualify]]
name = "proof-check"
stage = "packed"
run = ["/bin/sh", "-c", '''
set -u
d=$(mktemp -d) || exit 1; trap 'rm -rf "$d"' EXIT; cd "$d" || exit 1
cat > Good.lean <<'EOF'
theorem atpkg_control : 1 = 1 := rfl
EOF
cat > Bad.lean <<'EOF'
theorem atpkg_false : 1 = 2 := rfl
EOF
python3.14 -I - "{bin}" <<'PY'
import json, os, subprocess, sys
bins = sys.argv[1]
clean = bins + "/clean"
os.mkdir("home", 0o700)
home = os.getcwd() + "/home"
env = {"PATH": bins + ":/usr/bin:/bin:/usr/sbin:/sbin", "HOME": home, "TMPDIR": home, "XDG_CONFIG_HOME": home + "/.config",
       "XDG_CACHE_HOME": home + "/.cache", "XDG_DATA_HOME": home + "/.local/share", "CLEAN_CC": "/usr/bin/cc"}
def run(args, code=0, contains=None):
    p = subprocess.run(args, env=env, stdin=subprocess.DEVNULL, capture_output=True, timeout=180)
    both = p.stdout + p.stderr
    assert p.returncode == code, (args, p.returncode, both[-2000:])
    assert contains is None or contains.encode() in both, (args, contains, both[-2000:])
    return p
def refused(args, contains=None):
    p = subprocess.run(args, env=env, stdin=subprocess.DEVNULL, capture_output=True, timeout=180)
    both = p.stdout + p.stderr
    assert p.returncode in (1, 2) and both.strip(), (args, p.returncode, both[-2000:])
    assert contains is None or contains.encode() in both, (args, contains, both[-2000:])
    return p
def check(path, accepted=True, reason=None):
    p = run([clean, "check", "--json", path], 0 if accepted else 1, reason)
    d = json.loads(p.stdout)
    assert d["status"] == ("pass" if accepted else "fail") and d["decl_count"] > 0, d
    t = d["trust_summary"]
    assert t["sorry_axioms"] == 0 and t["sorry_terms_minted"] == 0 and b"synthetic sorry" not in p.stdout + p.stderr, d
    if accepted:
        assert d["failed_count"] == 0 and d["success_count"] > 0, d
        assert not (d["errors"] or d["parser_recovery"] or d["kernel_failures"] or d["trust_failures"]), d
    return d
good = run([clean, "check", "--json", "Good.lean"])
assert json.loads(good.stdout)["status"] == "pass"
refused([clean, "check", "--json", "Bad.lean"], "atpkg_false")
PY
''']
within-secs = 120

# The independent Alethe checker verifies a resolution proof and refuses one that resolves
# a premise with itself.
[[workspace.metadata.atpkg.qualify]]
name = "alethe"
stage = "packed"
run = ["/bin/sh", "-c", '''
set -u
d=$(mktemp -d) || exit 1; trap 'rm -rf "$d"' EXIT; cd "$d" || exit 1
python3.14 -I - "{bin}" <<'PY'
import json, os, subprocess, sys
bins = sys.argv[1]
clean = bins + "/clean"
os.mkdir("home", 0o700)
home = os.getcwd() + "/home"
env = {"PATH": bins + ":/usr/bin:/bin:/usr/sbin:/sbin", "HOME": home, "TMPDIR": home, "XDG_CONFIG_HOME": home + "/.config",
       "XDG_CACHE_HOME": home + "/.cache", "XDG_DATA_HOME": home + "/.local/share", "CLEAN_CC": "/usr/bin/cc"}
def run(args, code=0, contains=None):
    p = subprocess.run(args, env=env, stdin=subprocess.DEVNULL, capture_output=True, timeout=180)
