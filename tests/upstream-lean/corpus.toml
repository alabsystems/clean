# Pinned probe set for the upstream-Lean drop-in invariant.
#
# Author: Andrew Yates | Copyright 2026 Andrew Yates | License: Apache-2.0
#
# Each probe names ONE declaration in ONE pinned upstream Lean file and the
# outcome that declaration is expected to produce when driven through
# `clean compile <file> --decl <name> --emit trustir`. `clean compile` selects a
# single declaration, so a probe is a (file, decl) pair rather than a file.
#
# UNSEEDED. See baseline.toml `[seeding]` for why, for the ramp deadline, and
# for the command that seeds it. No `expected` value in this file may be written
# from intuition: it is the outcome a real run produced, or the row does not
# exist.
#
# ROW SCHEMA
#   id        stable probe identifier: "upstream-lean.<file-stem>.<decl>"
#   file      path RELATIVE to baseline.toml's [upstream] corpus_path
#   decl      the declaration name passed to `--decl`
#   expected  "lowers"   exit 0 and a textual TrustIr module on stdout
#             "rejected" a clean non-zero refusal (parse, elab, or lowering)
#             "empty"    exit 0 with no module text — a silent success that
#                        emitted nothing; pinnable, but review it hard
#   note      optional prose

schema_version = "0.1.0"
# (the empty `probes = []` that stood here was removed when the corpus was
# seeded: a bare key and an array-of-tables cannot both define `probes`.)
# SEEDED 2026-09-20 from a real run over the pinned corpus
# (`run_upstream_lean.py --seed-from-corpus-dir`, one top-level computational
# declaration per file, `clean` built with `--features trust-ir-backend`).
# Every `expected` below is the outcome that run produced. None was written from
# intuition.

