[package]
name = "clean-verify"
version.workspace = true
edition = "2021"
description = "EvalIR semantics and source/IR connections; legacy kernel metatheory"
license = "Apache-2.0"
repository.workspace = true
readme.workspace = true
# Test targets are declared explicitly below; see tests/spec_suite.rs.
autotests = false

[lints]
workspace = true

[features]
default = []
# Mathematical source/IR connection only; no runtime or proof-grade admission.
source-ir-identity = ["dep:clean-rust-sem"]
source-ir-word64-addition = ["source-ir-identity"]
# Expose test_utils for integration tests; propagates to clean-kernel
test-utils = ["clean-kernel/test-utils"]
# Enables the `cli` module (`clean verify proof` / `proof_check` compat shim).
# Default-off so non-CLI consumers keep a minimal dependency graph (no clap,
# no clean-features). Epic #3436, issue #3511.
sat-verify = ["dep:clap", "dep:clean-features"]

[dependencies]
clean-rust-sem = { workspace = true, optional = true }
blake3.workspace = true
clap = { workspace = true, optional = true }
clean-features = { workspace = true, features = ["serde"], optional = true }
clean-kernel = { path = "../clean-kernel" }
clean-parser = { path = "../clean-parser" }
clean-elab = { path = "../clean-elab" }
num-bigint.workspace = true
num-rational.workspace = true
serde.workspace = true
serde_json.workspace = true
syn = { workspace = true, features = ["full"] }
thiserror.workspace = true

[dev-dependencies]
# The kernel's native-fold mint bypass, for re-pinning the spec's fold
# digests (`tests/native_fold_canon_spec.rs`). Test builds only.
clean-kernel = { path = "../clean-kernel", features = ["test-fixtures"] }
proptest = { workspace = true }
tempfile = { workspace = true }
# Real deployed-workload corpus source for the model↔kernel fidelity gate
# (`src/fidelity_gate.rs`): load real `.olean` constant headers and partition
# them by the supported-fragment predicate. Dev-only — no `clean-*/src` crate
# gains an `.olean` dependency.
clean-olean = { path = "../clean-olean" }

# GAP-2 encoding differential (`tests/crystal_a3_semdiff.rs`): trust-ir's own
# parser and reference interpreter, used as an INDEPENDENT SECOND EXECUTOR of
# the committed emitted bodies. Pinned to the same rev as `trust-ir-contract`
# and the `clean-compiler` backend so all three read one producer.
#
# DEV-ONLY, deliberately. `clean-verify` is outside `default-members`, so this
# does not widen the publish smoke surface, and no `clean-*/src` crate gains a
# trust-ir dependency. It is also OUTSIDE THE TCB by construction: trust-ir is
# used only to POSE questions the Clean kernel answers, so a wrong parse or a
# wrong interpretation yields a spurious RED, never a spurious GREEN.
# `default-features = false` drops the ~330-symbol request/bundle re-export
# block, which this differential does not touch. `clean-expr-codec` (codecs
# only; replay authority stays behind trust-ir's `clean-expr`) lets the
# shift-boundary tests round-trip their proofs through the consumer's carrier.
trust-ir = { git = "https://github.com/alabsystems/trust-ir.git", rev = "899d46e7a303fad2b706a88a7a8eda41ec47dcfe", default-features = false, features = ["parser", "fmt", "clean-expr-codec"] }

# Self-dependency to enable test-utils + cli during cargo test. The `sat-verify`
# feature gates the `cli` module (and its behavioral tests); enabling it here
# means `cargo test -p clean-verify` exercises the proof-checker dispatch
# end-to-end without requiring `--features sat-verify` on the command line.
[dev-dependencies.clean-verify]
path = "."
features = ["test-utils", "sat-verify"]

# Compat shim binary for the legacy `proof_check` path. Retained for one
# release per Epic #3436 because SAT-COMP / SMT-COMP judges hard-code the
# binary path. Feature-gated so the heavy sat/smt dependency graph only links
# when the caller opts in. Issue #3511.
[[bin]]
name = "proof_check"
path = "src/bin/proof_check.rs"
required-features = ["sat-verify"]

# Regenerator for the crystal-A2 minted module artifacts (`src/ir_mint`). Pure:
# core module in, definition script and record out. The gate re-runs the same
# function, so this binary is a convenience and never an authority.
[[bin]]
name = "ir_mint_gen"
path = "src/bin/ir_mint_gen.rs"

# Test targets are declared explicitly because `autotests = false`: the
# specification-building targets are aggregated into ONE binary
# (`tests/spec_suite.rs`) so `Specification::new()` is built once per
# process instead of once per file. See that file's header.
# `scripts/check_test_target_coverage.py` refuses a `tests/*.rs` that is
# neither listed here nor `#[path]`-included by something that is.
[[test]]
name = "spec_suite"
path = "tests/spec_suite.rs"

[[test]]
name = "crystal_a1_lineage"
path = "tests/crystal_a1_lineage.rs"

[[test]]
name = "crystal_a3_semdiff"
path = "tests/crystal_a3_semdiff.rs"

[[test]]
name = "eval_ir"
path = "tests/eval_ir.rs"

[[test]]
name = "evalir_scratchpad"
path = "tests/evalir_scratchpad.rs"

[[test]]
name = "fidelity_gate_lane"
path = "tests/fidelity_gate_lane.rs"

[[test]]
name = "spec_scratchpad"
path = "tests/spec_scratchpad.rs"

