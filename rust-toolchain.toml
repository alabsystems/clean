# The Trust toolchain. Owner directive 2026-09-28: ALab systems build with
# Trust. This file selects the compiler only; the lane is chosen per command by
# `targo --unverified <verb>` or `targo trust <verb>`. The public snapshot keeps
# this pin: a public user installs aterm, and atpkg installs Trust. Clean's source
# must still compile with no Trust-only feature load-bearing, for two readers that
# never see this file: the trust bootstrap compiles Clean at stage0 with the seed
# trust's src/stage0 pins -- an older Trust build (never stock Rust since the owner's
# 2026-09-29 directive; until then the owner's Mac used a stock-Rust "genesis"
# stage0 there, quarantined that day) -- and deploy/'s Linux x86_64 Docker builds are a
# STOCK EXCEPTION (Trust ships no x86_64-linux std). The stable -> trust flip
# history this header used to carry: `git show 7330fa6ce:rust-toolchain.toml`.
[toolchain]
channel = "trust"
