# cargo-audit configuration. See https://docs.rs/cargo-audit for schema.
#
# Each entry under [advisories.ignore] documents WHY a specific RustSec
# advisory is suppressed for the Clean workspace. The guiding policy is:
#
#   * Fix the dep version if possible.
#   * Only ignore when an upgrade is not feasible right now, AND the
#     advisory is not a remotely exploitable vulnerability against this
#     codebase (clean is a CLI / library, not a network service exposed
#     to untrusted input on these paths).
#
# Revisit each ignore on every dependency bump. The list should shrink,
# not grow.

[advisories]
# Suppress only the advisories enumerated below. Anything not listed here
# remains a hard local/release gate failure.
ignore = [
    # bincode 1.3.x — unmaintained upstream (bincode 2.x is the active
    # line). The workspace pins bincode = "1.3" across clean-mathverse,
    # clean-server, and the kernel shard format; migrating to 2.x is a
    # breaking API change with on-disk format implications for
    # `.mathverse` shards (clean-mathverse::shard) and the JSON-RPC server.
    # Tracked separately; not a vulnerability, just an "unmaintained"
    # category advisory.
    "RUSTSEC-2025-0141",

    # paste 1.0.15 — unmaintained upstream. Pulled in transitively by
    # optional graphics/GPU stacks in older clean-gpu work and the `ark-ff` /
    # `ark-bls12-381` arkworks stack used by clean-fold.
    # No direct dependency in the workspace; upstream crates need to
    # migrate first. Not a vulnerability.
    "RUSTSEC-2024-0436",

    # lru 0.12.5 — `IterMut` violates Stacked Borrows by invalidating
    # an internal pointer. We use `lru` only inside clean-server for
    # bounded request caches and never call `iter_mut()` on it; the
    # unsound code path is not reachable from clean-server's surface.
    # Upgrade to lru >= 0.13 is queued behind a clean-server cache
    # refactor (the 0.13 API renamed several methods).
    "RUSTSEC-2026-0002",
]
informational_warnings = ["unmaintained", "unsound"]
