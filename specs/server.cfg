\* TLC Configuration for server.tla
\* Author: Andrew Yates <andrewyates.name@gmail.com>
\*
\* This configuration uses small finite sets for model checking.
\* Server protocol verification requires bounded concurrency.

CONSTANT
    ClientIds = {c1, c2}
    RequestIds = {r1, r2, r3}
    StateIds = {s1, s2}
    Methods = {method1, method2}
    MaxConcurrent = 2
    MaxPendingRequests = 3

SPECIFICATION FairSpec

INVARIANT TypeOK
INVARIANT ConcurrencyLimit
INVARIANT RequestResponseCorrespondence
INVARIANT NotificationsNoResponse
INVARIANT NoOrphanedRequests
INVARIANT GracefulShutdown
INVARIANT ExpiredNotAccessible
INVARIANT NoPendingResponseLeak

PROPERTY EventuallyStarts
PROPERTY RequestProcessingOrder
PROPERTY EventuallyShutdown
PROPERTY RequestsComplete
PROPERTY VersionMonotonic
