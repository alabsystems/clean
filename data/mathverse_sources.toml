# Mathverse Library upstream source manifest.
# Tracks configured formal-math library sources for automated refresh.
#
# Fields:
#   name            — human-readable name
#   git_url         — upstream git clone URL
#   file_type       — primary file extension (.mm, .olean, .lean, .vo, etc.)
#   import_tier     — kernel compatibility tier (1-5, per MATHVERSE_KERNEL_COMPATIBILITY.md)
#   clone_path      — local clone directory (used by download_all_libraries.sh)
#   last_fetched_sha  — HEAD sha at last successful fetch (empty until first run)
#   last_fetched_date — ISO 8601 date of last successful fetch (empty until first run)

