# cargo-deny configuration for the Clean workspace.
#
# Run locally with `cargo deny check` (advisories, licenses, bans, sources).
# WIRED INTO THE GATE: scripts/local_gate.sh runs `cargo deny check` in FULL
# mode (not the <30s --fast pre-push path) — a new dependency that violates
# advisories/licenses/bans/sources fails the gate fail-closed. The historical
# result in data/dep_boundary_state.json is marked stale after AY's Git
# migration and must be refreshed before a current GREEN claim. There is no
# hosted CI; enforcement is local and fail-closed (matches the rest of
# local_gate.sh). If a new dependency violates this policy, either fix the
# dependency or justify the exception here with a comment.
#
# Schema reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Restrict the dep graph to the targets we actually build on. Cuts noise
# from Windows-only / wasm-only transitive crates that we never link.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# [advisories] — RustSec advisory database policy
# ---------------------------------------------------------------------------
#
# cargo-audit covers this surface too (.cargo/audit.toml), but cargo-deny
# enforces it as part of the same gate. Keep the ignore list in sync.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"  # Allow yanked crates with a build warning. Yanked != vulnerable.
ignore = [
    # See .cargo/audit.toml for the full rationale on each of these.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.x unmaintained; 2.x migration tracked separately (shard format implications)" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained; pulled transitively via wgpu-hal/metal and arkworks ark-ff" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 unsound IterMut path not reachable from clean-server cache surface; 0.13 upgrade queued" },
]

# ---------------------------------------------------------------------------
# [licenses] — SPDX-based license policy
# ---------------------------------------------------------------------------

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    # webpki-roots (Mozilla CA bundle, pulled via ureq -> mathbot) ships its
    # trust-store data under the Community Data License Agreement Permissive 2.0.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "CC0-1.0",
]

# Per-crate license clarifications. Each entry is documented.
exceptions = [
    # gmp-mpfr-sys and rug are Rust bindings to the GMP and MPFR C
    # libraries used by `ay-lra` (rational arithmetic in the first-party
    # AY solver graph). Both are LGPL-3.0-or-later. We consume them
    # only through their published, dynamically-linkable C ABI;
    # clean itself is Apache-2.0 and does not redistribute GMP/MPFR
    # source. The LGPL exception is scoped narrowly to these two
    # crates and must be re-evaluated if either is ever statically
    # linked into a redistributable binary.
    { allow = ["LGPL-3.0-or-later"], crate = "gmp-mpfr-sys" },
    { allow = ["LGPL-3.0-or-later"], crate = "rug" },
]

# Crates whose license text cargo-deny cannot reliably auto-detect get an
# explicit clarification here. Each entry must include an upstream source
# of truth (LICENSE file path + expected hash, or SPDX expression).
[[licenses.clarify]]
# ring publishes its license metadata as a custom OpenSSL/SSLeay/MIT/ISC
# combination; the README declares ISC + MIT + OpenSSL. We only consume
# the ISC-compatible portions.
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ---------------------------------------------------------------------------
# [bans] — banned crates, duplicate-version policy, banned features
# ---------------------------------------------------------------------------

[bans]
multiple-versions = "warn"
# The workspace ships 30+ in-repository path-only crates. AY is not one of
# them: its crates use one immutable Git revision recorded in Cargo.lock.
# The path-only workspace crates are not published to crates.io (no
# `publish = false` is set because they're never released), so cargo-deny's
# `allow-wildcard-paths` workaround does not apply (it only covers crates
# explicitly marked unpublishable). We therefore allow wildcard deps
# unconditionally and rely on rustc / Cargo.lock to keep the resolved versions
# stable. If any crate here ever publishes, switch this to "deny" and set
# `publish = false` on the remaining members.
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

deny = [
    # We are an entirely rustls-based stack. openssl-sys would pull in
    # the system OpenSSL ABI, bloat builds, and introduce a second TLS
    # implementation. If something needs openssl-sys, switch it to a
    # rustls feature or replace the dependency.
    { crate = "openssl-sys", reason = "rustls-only policy; no native OpenSSL linkage" },
    { crate = "openssl", reason = "rustls-only policy; no native OpenSSL linkage" },
    # native-tls is the same problem one layer up.
    { crate = "native-tls", reason = "rustls-only policy; do not pull in platform TLS" },
]

# Skip duplicate-version warnings for crates where the dep graph
# legitimately resolves to multiple semver-incompatible majors and we
# cannot unify them without an upstream change. Each entry must include
# a comment naming the two consumers.
skip = []

skip-tree = []

# ---------------------------------------------------------------------------
# [sources] — registry / git source allowlist
# ---------------------------------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # carcara: optional SMT proof checker dep behind the `carcara-verify`
    # feature in clean-auto. Pinned to a specific rev in
    # crates/clean-auto/Cargo.toml.
    "https://github.com/ufmg-smite/carcara",
    # AY: first-party internal solver authority. All seven root manifest
    # entries and all 37 lock sources are required to share one immutable
    # revision by the factory/update/consumer-smoke gates.
    "https://github.com/alabsystems/ay.git",
]

[sources.allow-org]
# Keep this empty unless we adopt org-wide trust for an upstream. Each
# git dep should be vetted on its own.
github = []
