note = "RE-PINNED `lowers` 2026-10-08, closing the open divergence pinned `rejected` 2026-10-07. Real Lean v4.30.0-rc2 accepts the file (`lean 2077.lean -c out.c` exits 0, writes C, and prints `true true true`). Clean's elaboration layers were fixed 2026-10-07 (trailing optParam defaults, double-backtick and single-quote name literals, `m!`); what still refused it was LOWERING of every `import Lean` file: `build_ctor_env` refused the whole environment's constructor table at the first constructor field typed by a universe (`unsupported IR type expression: Sort(..)`). A `Sort`/`SProp`-typed field is a type and is erased at runtime, as Lean's compiler erases it (`clean_compiler::to_ir::types::ctor_field_ir_type`: an object slot holding the boxed unit, as for a proof field). Measured with `--clean-bin` of a `--release --features trust-ir-backend` build of that change: this probe moved `rejected` -> `lowers` and the other 55 probes matched their pins."
[[probes]]
