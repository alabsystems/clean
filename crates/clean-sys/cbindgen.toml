# cbindgen configuration for clean-sys C header generation

language = "C"
header = """
/*
 * clean C FFI Bindings
 * Copyright 2026 Andrew Yates
 * Author: Andrew Yates <andrewyates.name@gmail.com>
 * SPDX-License-Identifier: Apache-2.0
 *
 * Auto-generated header file. Do not edit manually.
 * Regenerate with: cbindgen --config cbindgen.toml -o include/clean.h
 */
"""
include_guard = "CLEAN_H"
include_version = true
autogen_warning = "/* Warning: this file was auto-generated by cbindgen. Don't modify this manually. */"

[defines]
# No conditional defines needed for this API

[export]
# Export all public items
include = ["cleanEnv", "cleanTypeChecker", "cleanExpr", "cleanError"]

[export.rename]
# Keep names as-is for clarity

[parse]
# Parse configuration
parse_deps = false
include = ["clean-sys"]

[fn]
# Function configuration
sort_by = "None"
must_use = "CLEAN_MUST_USE"

[struct]
# Struct configuration
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

[enum]
# Enum configuration
derive_helper_methods = false

[macro_expansion]
bitflags = false
