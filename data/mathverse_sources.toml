# Coq 8.20.0 stdlib, PINNED. Acquisition is NOT a git clone of this URL: the
# corpus is dumped from the isolated opam switch `mathverse-serapi`
# (coq.8.20.0 + coq-serapi, ~/.opam/mathverse-serapi/bin/sertop) via
# scripts/build_coq_serapi_dumps.sh into data/corpora/coq-sexp/stdlib/
# (`.sexp` importer-form dumps consumed by `mathverse_shard coq-import`).
# git_url records upstream provenance only; last_fetched_sha is pinned to the
# V8.20.0 release tag commit (the exact stdlib the opam switch builds).
