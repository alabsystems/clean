# Opt-in OFFLINE / vendored-source cargo config for clean.
#
# ⚠️  This file is NOT the default cargo config. Do NOT rename it to
# `config.toml` and do NOT merge these stanzas into `.cargo/config.toml`.
# The `[source.crates-io] replace-with = "vendored-sources"` stanza FORCES
# every build to resolve dependencies from the local `vendor/` tree. That tree
# is GITIGNORED (released as an artifact, not committed), so making it the
# default would break every checkout that has not run `cargo vendor` first —
# including all the parallel build sessions. Keep it strictly opt-in.
#
# HISTORICAL / CURRENTLY BLOCKED: this source map does not yet provision AY as
# a separate first-party subrepo. Do not invoke it directly. The only supported
# entry point is scripts/build_offline.sh, whose provenance preflight currently
# rejects the historical artifact against the AY-Git lockfile.
#
# PREREQUISITE: the vendor/ tree must exist and pass the third-party-only
# provenance preflight in scripts/build_offline.sh. Do not run raw `cargo
# vendor` after AY's Git migration: internal AY/NY repositories are subrepos,
# never vendor data. Fetch + extract a compatible released
# vendor-sources-v*.tar.zst artifact
#   (see scripts/package_vendor.sh and docs/SUPPLY_CHAIN_VENDORING.md).
#
# The `directory` path below is relative to the workspace root (cargo's config
# discovery walks up from the invocation cwd), so invoke cargo from the repo
# root. The current historical artifact predates AY's Git migration; a current
# artifact requires a third-party-only staging flow and separate first-party
# subrepo provisioning.

[source.crates-io]
replace-with = "vendored-sources"

[source."git+https://github.com/ufmg-smite/carcara?rev=fecb4224def3c26f93a5d4f1804ecf58eb979650"]
git = "https://github.com/ufmg-smite/carcara"
rev = "fecb4224def3c26f93a5d4f1804ecf58eb979650"
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
