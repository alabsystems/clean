note = "RE-PINNED 2026-10-07 lowers -> rejected, read against real Lean. 1569.lean is an upstream tests/elab_fail file: the example's `simp [typo]` is an error, and Lean's own compile driver refuses the MODULE -- `lean 1569.lean -c out.c` exits 1 and writes no C, on both v4.30.0-rc2 (the pin) and 4.8.0. clean now refuses too (the example's closure reaches sorryAx, 01189665c). The old `lowers` compiled a declaration out of a module Lean will not build. clean only WARNS on the unknown simp lemma where Lean errors; that is a separate, open divergence this probe does not measure."
